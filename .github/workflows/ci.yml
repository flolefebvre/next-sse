name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets `release.yml` run this exact gate before publishing, so the release path and
  # the everyday path can never drift apart.
  workflow_call:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The workspace scaffold hasn't landed yet: until a pnpm-lock.yaml exists at the
      # root, this job passes without running anything so docs-only commits stay green.
      # When the scaffold lands, delete this step and the `if:` guards below, and grow
      # the workflow into the ADR-0009 shape (backend matrix redis:8 + valkey/valkey:8,
      # e2e job) — then mirror the new job names into .github/rulesets/main.json.
      - name: Check for the workspace scaffold
        id: scaffold
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No pnpm-lock.yaml yet; skipping the gate until the workspace scaffold lands."
          fi

      - name: Install pnpm
        if: steps.scaffold.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        if: steps.scaffold.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run gate
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm run gate
