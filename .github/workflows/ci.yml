name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets `release.yml` run this exact gate before publishing, so the release path and
  # the everyday path can never drift apart.
  workflow_call:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job runs the whole ADR-0009 gate, Docker included: the runner has a daemon, so the
  # integration project's testcontainers and the e2e project's `next start` Instances both run
  # here.
  #
  # When this grows into the ADR-0009 shape — an `integration` matrix over redis:8 and
  # valkey/valkey:8, and an `e2e` job on valkey/valkey:8 alone — the job named `gate` must
  # survive as the job that `needs:` them and reports their verdict. `gate` is the required
  # status check in .github/rulesets/main.json, and a ruleset is only re-imported by hand:
  # keep the name and the split costs nobody anything.
  gate:
    name: gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No `version:` — the action reads `packageManager` from the root package.json, so the
      # pnpm version is stated in exactly one place.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gate
        run: pnpm run gate
